[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fin-copilot-mcp"
version = "0.1.0"
description = "Multi-Agent Financial Analytics Copilot powered by Anthropic MCP & Claude 3.5 Sonnet"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Prem Kishnani" }]
license = { text = "MIT" }
dependencies = [
    "fastmcp>=0.4.0",
    "mcp>=1.0.0",
    "anthropic>=0.39.0",
    "duckdb>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "yfinance>=0.2.40",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "bandit>=1.7.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]